version: "3.9"

services:

  # ── PostgreSQL Database ───────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: documind
      POSTGRES_USER: documind_user
      POSTGRES_PASSWORD: documind_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U documind_user -d documind"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Django Auth Backend ───────────────────────────────────────────────────
  django:
    build:
      context: .
      dockerfile: backend_django/Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env.docker
    environment:
      DB_HOST: db
      DB_NAME: documind
      DB_USER: documind_user
      DB_PASSWORD: documind_pass
      DB_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy

  # ── FastAPI RAG Backend ───────────────────────────────────────────────────
  fastapi:
    build:
      context: ./backend_fastapi
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8001:8001"
    env_file:
      - .env.docker
    volumes:
      # Persist the ChromaDB vector store across container restarts
      - chroma_data:/app/chroma_db

volumes:
  postgres_data:
  chroma_data:
